{% extends "base.html" %}

{% block title %}404 - Not Found | StockFlow{% endblock %}

{% block content %}
<div class="container-fluid px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4 text-center py-5">
            <div class="mb-4" style="font-size: 5rem; opacity: 0.15;">
                <i class="fas fa-box-open"></i>
            </div>
            <h1 class="display-4 fw-bold text-primary">404</h1>
            <h4 class="mb-3">Page Not Found</h4>
            <p class="text-muted mb-4">Sorry, we couldn't find that page. It may have been moved or doesn't exist.</p>
            <a href="/dashboard" class="btn btn-primary btn-lg px-5">
                <i class="fas fa-tachometer-alt me-2"></i>Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
