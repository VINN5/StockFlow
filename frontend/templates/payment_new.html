{% extends "base.html" %}

{% block title %}Record Payment - StockFlow{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Record Payment Received</h1>
    
    <div class="card shadow">
        <div class="card-body">
            <form method="POST" action="{{ url_for('payments.add') }}">
                <div class="mb-3">
                    <label class="form-label">Client</label>
                    <select name="client_id" class="form-select" required>
                        <option value="">Select client</option>
                        {% for client in clients %}
                        <option value="{{ client._id }}">{{ client.name }} (Balance: KSh {{ "%.2f"|format(client.balance) }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Amount Received</label>
                    <input type="number" name="amount" step="0.01" class="form-control" required min="0.01">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="method" class="form-select">
                        <option value="Cash">Cash</option>
                        <option value="M-Pesa">M-Pesa</option>
                        <option value="Bank">Bank Transfer</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-success btn-lg">Record Payment</button>
                <a href="{{ url_for('payments.index') }}" class="btn btn-secondary btn-lg ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
