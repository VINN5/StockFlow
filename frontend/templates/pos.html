{% extends "base.html" %}

{% block title %}POS Sales - StockFlow{% endblock %}

{% block content %}
<div class="container-fluid mt-3 px-3">
    <h1 class="mb-3">Point of Sale</h1>

    <div class="row g-3">
        <!-- Product grid -->
        <div class="col-12 col-lg-8 order-2 order-lg-1">
            <input type="text" id="searchInput" class="form-control form-control-lg mb-3"
                   placeholder="Search products..." onkeyup="searchProducts()">

            <div class="row g-2" id="productsGrid">
                {% for product in products %}
                <div class="col-6 col-sm-4 col-md-4 product-card" data-name="{{ product.name|lower }}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body text-center p-2">
                            <h6 class="card-title mb-1">{{ product.name }}</h6>
                            <p class="card-text mb-2 small text-muted">
                                Stock: <strong>{{ product.current_quantity }}</strong><br>
                                <strong class="text-success">KSh {{ "%.2f"|format(product.selling_price) }}</strong>
                            </p>
                            <button class="btn btn-primary btn-sm w-100 add-to-cart"
                                    data-id="{{ product._id }}"
                                    data-name="{{ product.name }}"
                                    data-price="{{ product.selling_price }}"
                                    {% if product.current_quantity <= 0 %}disabled{% endif %}>
                                <i class="fas fa-cart-plus"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Cart -->
        <div class="col-12 col-lg-4 order-1 order-lg-2">
            <div class="card shadow sticky-top" style="top: 70px;">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Cart</h5>
                </div>
                <div class="card-body p-3">
                    <!-- Client -->
                    <div class="mb-3">
                        <label for="clientSelect" class="form-label fw-bold small">Client (Optional)</label>
                        <select class="form-select form-select-sm" id="clientSelect">
                            <option value="">Cash Sale - No Client</option>
                            {% for client in clients %}
                            <option value="{{ client._id }}">{{ client.name }}{% if client.contact %} ({{ client.contact }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Payment method -->
                    <div class="mb-3">
                        <label for="paymentMethod" class="form-label fw-bold small">Payment Method</label>
                        <select class="form-select form-select-sm" id="paymentMethod">
                            <option value="cash">Cash</option>
                            <option value="credit">Credit (Add to Client Balance)</option>
                        </select>
                    </div>

                    <hr class="my-2">
                    <div id="cartItems"></div>
                    <hr class="my-2">
                    <h5 class="text-end mb-0">Total: <span id="cartTotal" class="text-success">KSh 0.00</span></h5>
                </div>
                <div class="card-footer p-2">
                    <button class="btn btn-success btn-lg w-100" id="checkoutBtn" disabled>
                        <i class="fas fa-cash-register me-2"></i>Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let cart = [];

function searchProducts() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.product-card').forEach(card => {
        card.style.display = card.dataset.name.includes(input) ? '' : 'none';
    });
}

document.querySelectorAll('.add-to-cart').forEach(btn => {
    btn.addEventListener('click', function () {
        if (this.disabled) return;
        const id = this.dataset.id;
        const name = this.dataset.name;
        const price = parseFloat(this.dataset.price);
        const existing = cart.find(item => item.id === id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ id, name, price, quantity: 1 });
        }
        updateCart();
    });
});

function updateCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = '';
    let total = 0;

    cart.forEach((item, index) => {
        const lineTotal = item.quantity * item.price;
        total += lineTotal;

        const div = document.createElement('div');
        div.className = 'd-flex justify-content-between align-items-center mb-2 p-2 bg-light rounded';
        div.innerHTML = `
            <div class="flex-grow-1 me-2">
                <strong class="small">${item.name}</strong><br>
                <small class="text-muted">${item.quantity} × KSh ${item.price.toFixed(2)}</small>
            </div>
            <div class="text-end flex-shrink-0">
                <strong class="small">KSh ${lineTotal.toFixed(2)}</strong><br>
                <button class="btn btn-sm btn-danger mt-1 remove-item" data-index="${index}">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
        container.appendChild(div);
    });

    document.getElementById('cartTotal').textContent = 'KSh ' + total.toFixed(2);
    document.getElementById('checkoutBtn').disabled = cart.length === 0;
}

document.getElementById('cartItems').addEventListener('click', function (e) {
    const btn = e.target.closest('.remove-item');
    if (btn) {
        cart.splice(parseInt(btn.dataset.index), 1);
        updateCart();
    }
});

document.getElementById('clientSelect').addEventListener('change', function () {
    const pm = document.getElementById('paymentMethod');
    if (this.value === '') {
        pm.value = 'cash';
        pm.disabled = true;
    } else {
        pm.disabled = false;
    }
});

document.getElementById('paymentMethod').disabled = !document.getElementById('clientSelect').value;

document.getElementById('checkoutBtn').addEventListener('click', function () {
    if (cart.length === 0) { alert('Cart is empty'); return; }
    const clientId = document.getElementById('clientSelect').value || null;
    const paymentMethod = document.getElementById('paymentMethod').value;
    if (paymentMethod === 'credit' && !clientId) { alert('Please select a client for credit sale'); return; }

    const items = cart.map(item => ({
        product_id: item.id,
        quantity: item.quantity,
        selling_price: item.price
    }));

    this.disabled = true;
    this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';

    fetch('/pos/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, payment_method: paymentMethod, client_id: clientId })
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            cart = [];
            updateCart();
            window.location.href = data.redirect;
        } else {
            alert(data.message || 'Sale failed. Please try again.');
        }
    })
    .catch(() => alert('Network error. Please try again.'))
    .finally(() => {
        const btn = document.getElementById('checkoutBtn');
        btn.disabled = cart.length === 0;
        btn.innerHTML = '<i class="fas fa-cash-register me-2"></i>Checkout';
    });
});
</script>

<style>
.product-card .card { transition: transform 0.15s; }
.product-card .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12) !important; }
</style>
{% endblock %}
