{% extends "base.html" %}

{% block title %}Edit Product - StockFlow{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Edit Product</h1>
    
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Update Product Details</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Unit</label>
                        <select name="unit" class="form-select">
                            <option value="piece" {% if product.unit == 'piece' %}selected{% endif %}>Piece</option>
                            <option value="kg" {% if product.unit == 'kg' %}selected{% endif %}>Kg</option>
                            <option value="liter" {% if product.unit == 'liter' %}selected{% endif %}>Liter</option>
                            <option value="bag" {% if product.unit == 'bag' %}selected{% endif %}>Bag</option>
                            <option value="box" {% if product.unit == 'box' %}selected{% endif %}>Box</option>
                            <option value="pack" {% if product.unit == 'pack' %}selected{% endif %}>Pack</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="2">{{ product.description or '' }}</textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Purchase Price (KSh) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="purchase_price" class="form-control" value="{{ product.purchase_price }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Selling Price (KSh) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" name="selling_price" class="form-control" value="{{ product.selling_price }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Current Stock Quantity</label>
                        <input type="number" name="current_quantity" class="form-control" value="{{ product.current_quantity }}" min="0">
                        <small class="form-text text-muted">Current balance. Updates automatically from sales/purchases.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Minimum Stock</label>
                        <input type="number" name="min_stock" class="form-control" value="{{ product.min_stock }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Maximum Stock (optional)</label>
                        <input type="number" name="max_stock" class="form-control" value="{{ product.max_stock or '' }}">
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Save Changes</button>
                    <a href="/products" class="btn btn-secondary btn-lg ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
