{% extends "base.html" %}
{% block title %}New Purchase - StockFlow{% endblock %}
{% block content %}
<style>
  .sf-label { display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#7d97ac; margin-bottom:.45rem; }
  .sf-input { width:100%; border:1.5px solid #e2e8f0; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.9rem; padding:.72rem 1rem; background:#fafbfc; color:#0d1b2a; outline:none; transition:border-color .2s, box-shadow .2s, background .2s; appearance:none; }
  .sf-input:focus { border-color:#f59e0b; background:#fff; box-shadow:0 0 0 3px rgba(245,158,11,.12); }

  .purchase-card { background:#fff; border:1px solid #e8edf2; border-radius:14px; box-shadow:0 1px 3px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05); margin-bottom:1rem; overflow:hidden; }
  .purchase-card-body { padding:1.25rem; }

  .item-row { background:#fff; border:1.5px solid #e8edf2; border-radius:12px; padding:1rem 1.1rem; margin-bottom:.75rem; transition:border-color .15s; }
  .item-row:hover { border-color:#c9d5de; }

  .total-bar {
    background:linear-gradient(135deg, #0d1b2a, #1a2f45);
    border-radius:12px; padding:1rem 1.4rem;
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:1.5rem;
  }
  .total-label { font-size:.78rem; font-weight:600; color:rgba(255,255,255,.45); letter-spacing:.05em; text-transform:uppercase; }
  .total-val   { font-size:1.5rem; font-weight:700; color:#f59e0b; font-family:'DM Mono',monospace; letter-spacing:-.02em; }

  .btn-add-item {
    display:inline-flex; align-items:center; gap:.5rem;
    background:#f0f4f8; border:1.5px dashed #c9d5de;
    border-radius:10px; color:#7d97ac;
    font-family:'DM Sans',sans-serif; font-size:.855rem; font-weight:500;
    padding:.65rem 1.1rem; cursor:pointer; width:100%;
    justify-content:center;
    transition:all .15s;
  }
  .btn-add-item:hover { border-color:#f59e0b; color:#92400e; background:#fef9c3; }

  .btn-remove { width:30px; height:30px; border-radius:7px; background:#fef2f2; color:#ef4444; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s; flex-shrink:0; font-size:.78rem; }
  .btn-remove:hover { background:#ef4444; color:#fff; }

  .sf-modal .modal-content { border-radius:16px; border:none; overflow:hidden; }
  .sf-breadcrumb { display:flex; align-items:center; gap:.5rem; font-size:.78rem; color:#7d97ac; margin-bottom:1.5rem; }
  .sf-breadcrumb a { color:#7d97ac; text-decoration:none; }
  .sf-breadcrumb a:hover { color:#0d1b2a; }
  .sf-breadcrumb-sep { opacity:.4; }
  .sf-breadcrumb-cur { color:#0d1b2a; font-weight:600; }
</style>

<div class="sf-breadcrumb">
  <a href="/purchases">Purchases</a>
  <span class="sf-breadcrumb-sep">/</span>
  <span class="sf-breadcrumb-cur">Record New Purchase</span>
</div>

<h1 style="font-size:1.45rem;font-weight:700;letter-spacing:-.025em;margin-bottom:1.5rem;">Record New Purchase</h1>

<form id="purchaseForm">

  <!-- Supplier -->
  <div class="purchase-card">
    <div class="purchase-card-body">
      <label class="sf-label">Supplier <span style="color:#ef4444;">*</span></label>
      <div style="display:flex;gap:.65rem;align-items:center;">
        <select name="supplier_id" id="supplierSelect" class="sf-input" required style="flex:1;">
          <option value="">— Select a supplier —</option>
          {% for supplier in suppliers %}
          <option value="{{ supplier._id }}">{{ supplier.name }}{% if supplier.contact_person %} · {{ supplier.contact_person }}{% endif %}</option>
          {% endfor %}
        </select>
        <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-1"
                data-bs-toggle="modal" data-bs-target="#addSupplierModal"
                style="white-space:nowrap;border-radius:10px;padding:.68rem 1rem;">
          <i class="fas fa-plus" style="font-size:.78rem;"></i> New
        </button>
      </div>
    </div>
  </div>

  <!-- Items -->
  <div style="font-size:1rem;font-weight:700;letter-spacing:-.01em;margin:.25rem 0 .85rem;">
    Purchase Items
  </div>

  <div id="itemsContainer">
    <div class="item-row">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-5">
          <label class="sf-label">Product</label>
          <select name="product_id" class="sf-input product-select" required>
            <option value="">— Select product —</option>
            {% for product in products %}
            <option value="{{ product._id }}" data-price="{{ product.purchase_price }}">
              {{ product.name }} (Stock: {{ product.current_quantity }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="sf-label">Quantity</label>
          <input type="number" name="quantity" class="sf-input" placeholder="0" min="1" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="sf-label">Cost Price (KSh)</label>
          <input type="number" step="0.01" name="cost_price" class="sf-input cost-price" placeholder="0.00" required>
        </div>
        <div class="col-12 col-md-1 d-flex justify-content-end align-items-end">
          <button type="button" class="btn-remove remove-item" title="Remove item">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <button type="button" class="btn-add-item mb-4" id="addItem">
    <i class="fas fa-plus" style="font-size:.8rem;"></i> Add Another Item
  </button>

  <div class="total-bar">
    <span class="total-label">Total Cost</span>
    <span class="total-val" id="totalCost">KSh 0.00</span>
  </div>

  <div style="display:flex;gap:.75rem;flex-wrap:wrap;">
    <button type="submit" class="btn btn-success" style="flex:1;min-width:160px;padding:.82rem;">
      <i class="fas fa-check me-2" style="font-size:.85rem;"></i> Record Purchase
    </button>
    <a href="/purchases" class="btn btn-outline-secondary" style="padding:.82rem 1.25rem;">Cancel</a>
  </div>
</form>

<!-- Add Supplier Modal -->
<div class="modal fade sf-modal" id="addSupplierModal">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
    <div class="modal-content">
      <form id="supplierForm">
        <div class="modal-header" style="background:#0d1b2a;">
          <h5 class="modal-title text-white d-flex align-items-center gap-2">
            <i class="fas fa-truck" style="color:#f59e0b;font-size:.9rem;"></i> Add New Supplier
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="sf-label">Supplier Name <span style="color:#ef4444;">*</span></label>
            <input type="text" name="name" class="sf-input" required>
          </div>
          <div class="mb-3">
            <label class="sf-label">Contact Person</label>
            <input type="text" name="contact_person" class="sf-input">
          </div>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="sf-label">Phone</label>
              <input type="tel" name="phone" class="sf-input">
            </div>
            <div class="col-12 col-md-6">
              <label class="sf-label">Email</label>
              <input type="email" name="email" class="sf-input">
            </div>
          </div>
          <div class="mt-3">
            <label class="sf-label">Address</label>
            <textarea name="address" class="sf-input" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer" style="background:#f8fafc;">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Add Supplier</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('addItem').addEventListener('click', () => {
  const c = document.getElementById('itemsContainer');
  const row = c.querySelector('.item-row').cloneNode(true);
  row.querySelectorAll('input,select').forEach(el => el.value='');
  c.appendChild(row); calculateTotal();
});

document.getElementById('itemsContainer').addEventListener('click', e => {
  if (e.target.closest('.remove-item')) {
    if (document.querySelectorAll('.item-row').length > 1) {
      e.target.closest('.item-row').remove(); calculateTotal();
    }
  }
});

document.getElementById('itemsContainer').addEventListener('input', calculateTotal);
document.getElementById('itemsContainer').addEventListener('change', e => {
  const sel = e.target.closest('.product-select');
  if (sel) {
    const opt = sel.selectedOptions[0];
    const row = sel.closest('.item-row');
    if (opt && opt.dataset.price) row.querySelector('.cost-price').value = opt.dataset.price;
    calculateTotal();
  }
});

function calculateTotal() {
  let t = 0;
  document.querySelectorAll('.item-row').forEach(row => {
    t += (parseFloat(row.querySelector('[name="quantity"]').value)||0) *
         (parseFloat(row.querySelector('[name="cost_price"]').value)||0);
  });
  document.getElementById('totalCost').textContent = 'KSh ' + t.toFixed(2);
}

document.getElementById('purchaseForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {
    supplier_id: document.querySelector('[name="supplier_id"]').value,
    items: []
  };
  document.querySelectorAll('.item-row').forEach(row => {
    data.items.push({
      product_id: row.querySelector('[name="product_id"]').value,
      quantity: parseInt(row.querySelector('[name="quantity"]').value),
      cost_price: parseFloat(row.querySelector('[name="cost_price"]').value)
    });
  });
  const btn = document.querySelector('[type="submit"]');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving…';
  fetch('/purchases/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) })
    .then(r=>r.json()).then(d => {
      window.location.href = (d.success && d.redirect) ? d.redirect : '/purchases';
    }).catch(() => { alert('Error recording purchase.'); btn.disabled=false; });
});

document.getElementById('supplierForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  fetch('/suppliers/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) })
    .then(r=>r.json()).then(res => {
      if (res.success) {
        const sel = document.getElementById('supplierSelect');
        const opt = new Option(data.name + (data.contact_person ? ' · ' + data.contact_person : ''), res.supplier_id, true, true);
        sel.appendChild(opt);
        bootstrap.Modal.getInstance(document.getElementById('addSupplierModal')).hide();
        e.target.reset();
      } else { alert(res.message || 'Error adding supplier'); }
    });
});
</script>
{% endblock %}
